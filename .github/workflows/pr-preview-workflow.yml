name: PR Preview

# PR の内容でサイトをビルドし、成果物（dist）をダウンロードできるようにする。
# ブラウザでそのまま開けるプレビューの用意は docs/pr-preview.md を参照
# （Cloudflare Pages を接続すると PR ごとにプレビュー URL が自動で付く）。
# これはその土台として、どの PR でもビルドが通ることと中身の確認を担う。

on:
  pull_request:
    branches: [main, feat/astro-migration]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-${{ github.event.pull_request.number || github.run_number }}
          path: dist
          retention-days: 14
          if-no-files-found: error
