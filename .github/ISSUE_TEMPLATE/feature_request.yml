name: 要望・新機能
description: 新しいページや機能のアイデア、改善の提案
title: "[feat] "
labels: ["type:enhancement"]
body:
  - type: textarea
    id: purpose
    attributes:
      label: 何をしたいか・なぜ必要か
      description: 誰のための、どんな機能ですか
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 具体的な案
      description: 画面のイメージや参考サイトがあれば書いてください
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: 規模の自己申告（分かる範囲で）
      options:
        - label: 文言や画像の差し替えだけで済みそう
        - label: ページの追加・改修が必要そう
        - label: 新しい仕組み（記事投稿など）が必要そう
        - label: 分からない（相談したい）
